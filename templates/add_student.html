{% extends 'base.html' %}

{% block title %}Add New Student - Student Management Portal{% endblock %}
{% block page_heading %}Add New Student{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-header bg-white py-3">
        <h6 class="m-0 font-weight-bold text-primary"><i class="bi bi-person-plus-fill me-2"></i>Student Registration Form</h6>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('student.add_student') }}" enctype="multipart/form-data">
            <div class="row g-3 mb-4">
                <!-- Student Photo Upload & Preview -->
                <div class="col-12 text-center mb-3">
                    <div class="position-relative d-inline-block">
                        <img id="photoPreview" src="{{ url_for('static', filename='uploads/default_avatar.png') }}" 
                             alt="Student Avatar" class="rounded-circle border p-1 shadow-sm" style="width: 110px; height: 110px; object-fit: cover;">
                    </div>
                    <div class="mt-2">
                        <label for="photo" class="btn btn-sm btn-outline-primary cursor-pointer">
                            <i class="bi bi-camera me-1"></i> Upload Student Photo
                        </label>
                        <input type="file" class="d-none" id="photo" name="photo" accept="image/*">
                        <div class="form-text small">Optional. Allowed: PNG, JPG, JPEG, WEBP (Max 16MB)</div>
                    </div>
                </div>

                <!-- USN / Roll Number -->
                <div class="col-12 col-md-6">
                    <label for="usn" class="form-label font-weight-semibold">USN / Roll Number <span class="text-danger">*</span></label>
                    <input type="text" class="form-control font-monospace" id="usn" name="usn" value="{{ form_data.usn or '' }}" placeholder="e.g. 1MS21CS045" required>
                </div>

                <!-- Full Name -->
                <div class="col-12 col-md-6">
                    <label for="name" class="form-label font-weight-semibold">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ form_data.name or '' }}" placeholder="e.g. Rahul Sharma" required>
                </div>

                <!-- Department -->
                <div class="col-12 col-md-6">
                    <label for="department" class="form-label font-weight-semibold">Department <span class="text-danger">*</span></label>
                    <select class="form-select" id="department" name="department" required>
                        <option value="">Select Department</option>
                        {% for dept in departments %}
                            <option value="{{ dept }}" {% if form_data.department == dept %}selected{% endif %}>{{ dept }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Semester -->
                <div class="col-12 col-md-6">
                    <label for="semester" class="form-label font-weight-semibold">Semester (1 - 8) <span class="text-danger">*</span></label>
                    <select class="form-select" id="semester" name="semester" required>
                        <option value="">Select Semester</option>
                        {% for sem in range(1, 9) %}
                            <option value="{{ sem }}" {% if form_data.semester|string == sem|string %}selected{% endif %}>Semester {{ sem }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Date of Birth -->
                <div class="col-12 col-md-4">
                    <label for="dob" class="form-label font-weight-semibold">Date of Birth <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="dob" name="dob" value="{{ form_data.dob or '' }}" required>
                </div>

                <!-- Gender -->
                <div class="col-12 col-md-4">
                    <label for="gender" class="form-label font-weight-semibold">Gender <span class="text-danger">*</span></label>
                    <select class="form-select" id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male" {% if form_data.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if form_data.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if form_data.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <!-- Phone Number -->
                <div class="col-12 col-md-4">
                    <label for="phone" class="form-label font-weight-semibold">Phone Number (10 Digits) <span class="text-danger">*</span></label>
                    <input type="tel" class="form-control" id="phone" name="phone" value="{{ form_data.phone or '' }}" placeholder="e.g. 9876543210" required>
                </div>

                <!-- Email Address -->
                <div class="col-12 col-md-6">
                    <label for="email" class="form-label font-weight-semibold">Email Address <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ form_data.email or '' }}" placeholder="e.g. rahul@example.com" required>
                </div>

                <!-- Address -->
                <div class="col-12 col-md-6">
                    <label for="address" class="form-label font-weight-semibold">Residential Address <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="address" name="address" value="{{ form_data.address or '' }}" placeholder="Street name, City, Pin Code" required>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                <a href="{{ url_for('student.list_students') }}" class="btn btn-light px-4">Cancel</a>
                <button type="submit" class="btn btn-primary px-4 font-weight-bold"><i class="bi bi-save me-1"></i> Save Student Record</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
