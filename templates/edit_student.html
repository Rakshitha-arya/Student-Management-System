{% extends 'base.html' %}

{% block title %}Edit Student - {{ student.name }}{% endblock %}
{% block page_heading %}Edit Student Record{% endblock %}

{% block content %}
<div class="card border-0 shadow-sm">
    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <h6 class="m-0 font-weight-bold text-primary"><i class="bi bi-pencil-square me-2"></i>Edit Information for {{ student.name }}</h6>
        <span class="badge bg-light text-dark border font-monospace fs-6">{{ student.usn }}</span>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('student.edit_student', student_id=student.id) }}" enctype="multipart/form-data">
            <div class="row g-3 mb-4">
                <!-- Student Photo Upload & Preview -->
                <div class="col-12 text-center mb-3">
                    <div class="position-relative d-inline-block">
                        <img id="photoPreview" src="{{ url_for('static', filename='uploads/' + (student.photo_filename or 'default_avatar.png')) }}" 
                             alt="Student Avatar" class="rounded-circle border p-1 shadow-sm" style="width: 110px; height: 110px; object-fit: cover;"
                             onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name={{ student.name|urlencode }}&background=random';">
                    </div>
                    <div class="mt-2">
                        <label for="photo" class="btn btn-sm btn-outline-primary cursor-pointer">
                            <i class="bi bi-camera me-1"></i> Change Student Photo
                        </label>
                        <input type="file" class="d-none" id="photo" name="photo" accept="image/*">
                    </div>
                </div>

                <!-- USN / Roll Number -->
                <div class="col-12 col-md-6">
                    <label for="usn" class="form-label font-weight-semibold">USN / Roll Number <span class="text-danger">*</span></label>
                    <input type="text" class="form-control font-monospace" id="usn" name="usn" value="{{ student.usn }}" required>
                </div>

                <!-- Full Name -->
                <div class="col-12 col-md-6">
                    <label for="name" class="form-label font-weight-semibold">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ student.name }}" required>
                </div>

                <!-- Department -->
                <div class="col-12 col-md-6">
                    <label for="department" class="form-label font-weight-semibold">Department <span class="text-danger">*</span></label>
                    <select class="form-select" id="department" name="department" required>
                        {% for dept in departments %}
                            <option value="{{ dept }}" {% if student.department == dept %}selected{% endif %}>{{ dept }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Semester -->
                <div class="col-12 col-md-6">
                    <label for="semester" class="form-label font-weight-semibold">Semester (1 - 8) <span class="text-danger">*</span></label>
                    <select class="form-select" id="semester" name="semester" required>
                        {% for sem in range(1, 9) %}
                            <option value="{{ sem }}" {% if student.semester == sem %}selected{% endif %}>Semester {{ sem }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Date of Birth -->
                <div class="col-12 col-md-4">
                    <label for="dob" class="form-label font-weight-semibold">Date of Birth <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" id="dob" name="dob" value="{{ student.formatted_dob }}" required>
                </div>

                <!-- Gender -->
                <div class="col-12 col-md-4">
                    <label for="gender" class="form-label font-weight-semibold">Gender <span class="text-danger">*</span></label>
                    <select class="form-select" id="gender" name="gender" required>
                        <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                        <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                        <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <!-- Phone Number -->
                <div class="col-12 col-md-4">
                    <label for="phone" class="form-label font-weight-semibold">Phone Number <span class="text-danger">*</span></label>
                    <input type="tel" class="form-control" id="phone" name="phone" value="{{ student.phone }}" required>
                </div>

                <!-- Email Address -->
                <div class="col-12 col-md-6">
                    <label for="email" class="form-label font-weight-semibold">Email Address <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ student.email }}" required>
                </div>

                <!-- Address -->
                <div class="col-12 col-md-6">
                    <label for="address" class="form-label font-weight-semibold">Address <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="address" name="address" value="{{ student.address }}" required>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                <a href="{{ url_for('student.list_students') }}" class="btn btn-light px-4">Cancel</a>
                <button type="submit" class="btn btn-primary px-4 font-weight-bold"><i class="bi bi-check2-circle me-1"></i> Update Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
